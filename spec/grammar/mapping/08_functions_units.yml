argumentDef:
  grammar:
    rule: argumentDef
  kind: Instance
  target: IlisMeta16.ModelData.Argument
  parent:
    association: FormalArgument
    role: Argument
  attribute_bindings:
    Name:
      source:
        field: Name
      note: Inherited attribute Argument.Name (mandatory, ilismeta16-classes.yml).
  note: 'Kind is resolved by the argumentType dispatcher. Grammar: Name COLON
    argumentType.'
argumentType:
  grammar:
    rule: argumentType
  kind: Dispatcher
  dispatches_to:
  - type
  - attrType
  attribute_bindings:
    Kind:
      source:
        field: attrTypeDef|OBJECT|OBJECTS|ENUMVAL|ENUMTREEVAL
        kind: alt_rule_or_token
        optional: true
      mapping:
        attrTypeDef_present: Type
        OBJECT_present: Type
        OBJECTS_present: Type
        ENUMVAL: EnumVal
        ENUMTREEVAL: EnumTreeVal
      note: 'Alt2 ("(OBJECT|OBJECTS) OF ...") also dispatches Kind=Type, same
        as alt1 - both dispatch Type, distinguished only by the concrete Type
        subtype (see _type_ref below and _object_of_variant). Argument.Kind
        stays exactly Type/EnumVal/EnumTreeVal (ilismeta16-kind-values.yml,
        mandatory: true).'
    _type_ref:
      source:
        field: attrTypeDef|restrictedClassOrAssRef|viewRef
        optional: true
      note: 'For a `field:` already in pipe form, the alt_token/"|" mechanism
        tries each name and keeps whichever is present, independently of any
        `alt:` (see source_resolver.py). When Kind=Type, feeds the
        ArgumentType association (Type end, target IlisMeta16.ModelData.Type):
        for alt1 (attrTypeDef) the concrete subtype follows attrTypeDef''s own
        mechanism; for alt2 (OBJECT|OBJECTS OF ...) it''s
        IlisMeta16.ModelData.ObjectType (see _object_of_variant).'
  note: 'Grammar (argumentType(), 4 alternatives): alt1 attrTypeDef, alt2
    (OBJECT|OBJECTS) OF (restrictedClassOrAssRef|viewRef), alt3 ENUMVAL, alt4
    ENUMTREEVAL.'
composedUnit:
  grammar:
    rule: composedUnit
  kind: Container
  attribute_bindings:
    Operands:
      source:
        field: unitRef
        multi: true
      note: The unitRef-typed operands (first plus each subsequent one after
        MUL/DIV/POW) resolve to Unit references and feed the enclosing Unit's
        Definition (Expression). The metamodel doesn't further specify the
        composed-unit expression shape, so ModelBuilder must build an
        appropriate Expression/CompoundExpr-like structure from these
        operands and the MUL/DIV/POW operators.
  note: 'No direct IlisMeta16 instance expected: sets Kind=ComposedU on the
    enclosing Unit (created by unitDef) and feeds a NumUnit association for
    each combined unitRef. Grammar (.g4 line 354): LPAR (unitRef|Name|INTERLIS
    DOT Name) ((MUL|DIV|POW) (unitRef|INTERLIS DOT Name|Name))* RPAR. No
    dedicated "ComposedUnit" class/datatype exists in the metamodel - only
    Unit.Kind=ComposedU marks a Unit as composed (ilismeta16-kind-values.yml).'
derivedUnit:
  grammar:
    rule: derivedUnit
  kind: Container
  attribute_bindings:
    _definition:
      status: not_applicable
      note: 'The factor (DecConst { (''*''|''/'') DecConst }) or FUNCTION Explanation and the [UnitRef]
        describe the conversion to the base unit; Unit.Definition (an Expression) is not built from them -
        no converter reads it. The unit itself is built by unitDef with Kind=DerivedU.'
  note: 'eCH-0031 V2.1.0 3.9.3: DerivedUnit = [ DecConst { ( ''*'' | ''/'' ) DecConst } | ''FUNCTION''
    Explanation ] ''['' UnitRef '']''. Reached from unitDef''s ''='' clause; sets Kind=DerivedU on the
    enclosing Unit (unitDef''s dynamic discriminant).'
functionDef:
  grammar:
    rule: functionDef
  kind: Instance
  target: IlisMeta16.ModelData.FunctionDef
  parent:
    association: PackageElements
    role: Element
  attribute_bindings:
    Name:
      source:
        field: Name
        index: 0
      note: Inherited attribute FunctionDef.Name (mandatory, ilismeta16-classes.yml).
    Explanation:
      source:
        field: Explanation
        optional: true
      note: FunctionDef.Explanation (own, 0..1), the raw `// ... //` text as written.
  note: 'Grammar (functionDef()): FUNCTION Name LPAR (argumentDef (SEMI
    argumentDef)*)? RPAR COLON (BOOLEAN | argumentType | Name) Explanation? SEMI
    (eCH-0031 V2.1.0 3.14: the argument list may be empty, the result is an
    ArgumentType - OBJECTS OF included - and may be followed by an Explanation). Renamed
    from functionDecl (upstream issue #2, geostandards-ch/interlis-antlr4) -
    this rule builds the real FunctionDef of the INTERLIS 2 spec; the
    unrelated unit-adjacent rule below was renamed to functionallyDerivedUnit
    to free up this name.'
parameterDef:
  grammar:
    rule: parameterDef
  kind: Instance
  target: IlisMeta16.ModelData.AttrOrParam
  parent:
    association: ClassParam
    role: ClassParameter
  attribute_bindings:
    Name:
      source:
        field: Name
      note: Inherited attribute AttrOrParam.Name (mandatory, ilismeta16-classes.yml).
    Abstract:
      source:
        field: ABSTRACT
        presence: true
      note: Inherited attribute AttrOrParam.Abstract (from ExtendableME),
        resolved from the optional (ABSTRACT|EXTENDED|FINAL) group - same
        pattern as classDef's own Abstract/Final handling.
    Final:
      source:
        field: FINAL
        presence: true
      note: Same optional-group pattern as Abstract above. EXTENDED has no
        AttrOrParam/ExtendableME attribute distinct from Abstract/Final (see
        classDef note - Generic is a separate ExtendableME attribute not tied
        to any token here).
  note: 'Grammar (parameterDef()): Name (LPAR (ABSTRACT|EXTENDED|FINAL)
    RPAR)? COLON (attrTypeDef | METAOBJECT (OF metaObjectRef)?) SEMI - the
    PARAMETER keyword opens the whole section in classOrStructureDef
    (eCH-0031 V2.1.0 3.5.1, ClassOrStructureDef = ... [ ''PARAMETER'' {
    ParameterDef } ]), so every following definition is a parameter. The
    METAOBJECT(...) branch may instead reference MetaObjectDef - unconfirmed
    against a real .ili example using PARAMETER METAOBJECT.'
runTimeParameterDef:
  grammar:
    rule: runTimeParameterDef
  kind: Instance
  target: IlisMeta16.ModelData.AttrOrParam
  parent:
    association: PackageElements
    role: Element
  attribute_bindings:
    Name:
      source:
        field: Name
  note: 'Grammar (runTimeParameterDef()): Name COLON attrTypeDef SEMI - one entry of a model''s
    PARAMETER section; the keyword opens the section in modeldef (eCH-0031 V2.1.0 3.11,
    RunTimeParameterDef = ''PARAMETER'' { RunTimeParameter-Name '':'' AttrTypeDef '';'' }). A run-time
    parameter has no Properties in the manual.'
unitDef:
  grammar:
    rule: unitDef
  kind: Instance
  target: IlisMeta16.ModelData.Unit
  discriminant:
    attribute: Kind
    dynamic: true
    rule:
      derivedUnit: DerivedU
      composedUnit: ComposedU
    default: BaseU
  parent:
    association: PackageElements
    role: Element
  attribute_bindings:
    Name:
      source:
        field: Name
        index: 0
      note: Inherited attribute Unit.Name (mandatory, ilismeta16-classes.yml).
    Abstract:
      source:
        field: ABSTRACT
        presence: true
      note: Inherited attribute (ExtendableME.Abstract), resolved from the
        optional (LPAR ABSTRACT RPAR) group.
  note: 'eCH-0031 V2.1.0 3.9.3: UnitDef = ''UNIT'' { Unit-Name [ ''('' ''ABSTRACT'' '')'' | ''[''
    UnitShort-Name '']'' ] [ ''EXTENDS'' Abstract-UnitRef ] [ ''='' ( DerivedUnit | ComposedUnit ) ]
    '';'' }. Grammar: UNIT? Name (LSBR Name RSBR)? (LPAR ABSTRACT RPAR)? (EXTENDS unitRef)? (EQ
    (derivedUnit | composedUnit))? SEMI - one entry per context, UNIT optional so the entries of one
    UNIT section follow each other. Kind (mandatory): DerivedU or ComposedU after ''='', BaseU
    otherwise (a base or abstract unit, possibly EXTENDS another).'
unitRef:
  grammar:
    rule: unitRef
  kind: Reference
  target: IlisMeta16.ModelData.UnitRef
  attribute_bindings:
    Unit:
      source:
        field: INTERLIS+DOT+Name|Name+DOT+Name
        join: .
      note: 'Attribute Unit: INTERLIS.NAME (0..1) on IlisMeta16.ModelData.UnitRef
        (ilismeta16-datatypes.yml); populated by joining all Name tokens (and
        the literal INTERLIS qualifier when alt2 matches) with "." separators,
        mirroring the same join pattern used for classRef/structureRef/domainRef.'
  note: 'Grammar (unitRef(), 2 alternatives): alt1 Name (DOT Name)*, alt2
    INTERLIS DOT Name.'
