associationDef:
  grammar:
    rule: associationDef
  kind: Instance
  target: IlisMeta16.ModelData.Class
  discriminant:
    attribute: Kind
    value: Association
  parent:
    association: PackageElements
    role: Element
  attribute_bindings:
    Name:
      source:
        field: Name
        index: 0
    Abstract:
      source:
        field: ABSTRACT
        presence: true
    Final:
      source:
        field: FINAL
        presence: true
    Super:
      association: Inheritance
      role: Super
      source:
        field: associationRef
        optional: true
      note: '`[ ''EXTENDS'' AssociationRef ]` (eCH-0031 V2.1.0 §3.6.1 AssociationDef EBNF) - same
        `Inheritance` association as classDef.Super; `associationRef` resolves directly to the base
        association (`kind: Reference`, Class with Kind=Association). Without it a derived association
        (`ASSOCIATION Albus EXTENDS MapProjection`, CoordSys-20151124.ili) had no base, hence none of its
        inherited roles or attributes.'
associationRef:
  grammar:
    rule: associationRef
  kind: Reference
  target: IlisMeta16.ModelData.Class
  discriminant:
    attribute: Kind
    value: Association
  attribute_bindings:
    _resolution:
      note: 'Pure reference resolution: qualified name (Name (DOT Name)?)? Name resolves to an existing
        IlisMeta16.ModelData.Class with Kind=Association (same pattern as classRef/structureRef); no own
        attributes constructed.'
  note: Association roles and cardinalities
cardinality:
  grammar:
    rule: cardinality
  kind: ValueObject
  target: IlisMeta16.ModelData.Multiplicity
  attribute_bindings:
    Min:
      source:
        field: PosNumber
        index: 0
      rule:
        MUL_alone: 0
        PosNumber: literal_value
      note: confirmed Multiplicity.own.Min (MultRange, mandatory). '{*}' alone means {0..*} (Min=0); '{PosNumber}'
        or '{PosNumber..X}' - the first PosNumber is Min.
    Max:
      source:
        field: MUL|PosNumber
        index: 1
        optional: true
      rule:
        MUL_alone: '*'
        MUL_after_DOTDOT: '*'
        PosNumber_after_DOTDOT: literal_value
        absent: same_as_Min
      note: confirmed Multiplicity.own.Max (MultRange, 0..1). '{*}' -> Max='*' (unbounded); '{N..*}' ->
        Max='*'; '{N..M}' -> Max=M; '{N}' alone (no DOTDOT) -> Max defaults to same value as Min (exact
        cardinality), per grammar structure where DOTDOT+bound is optional.
  note: 06_types
roleDef:
  grammar:
    rule: roleDef
  kind: Instance
  target: IlisMeta16.ModelData.Role
  parent:
    association: AssocRole
    role: Role
  attribute_bindings:
    Name:
      source:
        field: Name
    Strongness:
      source:
        field: MINUS
        sequence_pattern: true
        optional: true
      rule:
        MINUS MINUS: Assoc
        MINUS LT GT: Aggr
        MINUS LT HASH GT: Comp
      note: 'Confirmed against INTERLIS 2 Reference Manual §2.7.2 "Force of relationship": -- = Association,
        -<> = Aggregation (marks the role leading to the whole), -<#> = Composition (marks the role leading
        to the whole). Each role''s own symbol directly encodes its Strongness value. optional:true because
        of Alternative 2 (an association attribute, no symbol at all - see rule-level note).

        '
    Ordered:
      source:
        field: ORDERED
        presence: true
      note: part of the (modifiers) group in LPAR...RPAR before the strength symbol
    Multiplicity:
      source:
        field: cardinality
        optional: true
    BaseClass:
      association: BaseClass
      role: BaseClass
      source:
        field: restrictedClassOrAssRef
        path: BaseRef
        multi: true
        optional: true
      note: 'No binding used to cover the target class reference
        of restrictedClassOrAssRef().
        Role EXTENDS ReferenceType EXTENDS ClassRelatedType (ilismeta16-classes.yml): the same
        BaseClass association (CRT{0..*} ClassRelatedType <-> BaseClass{0..*} Class, ilismeta16-associations.yml)
        already used for any other ClassRelatedType applies here. restrictedClassOrAssRef() returns
        a bag {BaseRef: ForwardRef, AnyClass, Restrictions} - BaseRef is the resolved base name. `multi:
        true` binds every alternative of `A OR B` (eCH-0031 V2.1.0 §3.7.1: "Einer Rolle können auch
        alternativ verschiedene Klassen ... zugeordnet sein"), real example CHBase_Part4 V2
        `Supervisor (EXTERNAL) -<> {1..1} Agency OR ...AdministrativeElement`; BaseClass (0..*) holds them
        all, the first being the primary target.'
    External:
      source:
        field: EXTERNAL
        presence: true
      note: 'Role.External (BOOLEAN) - true when the role carries the `(EXTERNAL)` clause (eCH-0031 V2.1.0 3.7.5,
        the opposite class lives outside the basket). Role.EmbeddedTransfer is a different, derived attribute (XTF
        embedding, 4.3.9) set once the whole model is built, see InterlisModelBuilder._apply_derived_role_flags.'
  note: 'Strongness resolved dynamically: LT/GT -> Assoc, HASH -> Comp, default -> Aggr (needs confirmation
    against kind-values.yml) || Grammar covers two distinct alternatives sharing this rule name: --- Alternative
    1 (spec-documented, §2.7.1 EBNF): full role declaration --- Name (modifiers)? (--|-<>|-<#>) cardinality?
    restrictedClassOrAssRef (OR restrictedClassOrAssRef)* (ASSIGN STRING)? SEMI ASSIGN STRING at the end:
    spec EBNF shows '':='' Role-Factor (an Expression), but the ANTLR grammar (2.4 dialect) only matches
    a literal STRING here, not a full factor. Purpose/target attribute unclear - not yet mapped. --- Alternative
    2 --- Name COLON MANDATORY? (attrTypeDef | enumeration | numeric | constraintDef) SEMI is an association
    ATTRIBUTE, not a role: eCH-0031 V2.1.0 §3.6.1 AssociationDef = ... { RoleDef } [ ''ATTRIBUTE'' ] {
    AttributeDef } ..., and every RoleDef carries ''--''/''-<>''/''-<#>''; this grammar lets roleDef absorb
    the AttributeDefs that follow the roles. Real examples: models/IlisMeta16.ili NumsRefSys ''Axis:
    AxisInd'' (no role named Axis exists to restrict), CoordSys-20151124.ili MapProjection
    ''FromCo1_FundPt: MANDATORY Angle_DMS_90''. Built as an AttrOrParam attached through ClassAttr
    (InterlisModelBuilder._build_instance), MANDATORY through the same deferred Mandatory override as
    attributeDef; the Role bindings above never apply to it.'
